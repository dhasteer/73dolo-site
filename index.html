<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>73 DOLO</title>
    <meta name="description" content="73 DOLO Events, Poker Nights, Housewarming, and archives.">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="static/css/style.css">
</head>
<body>

    <div class="main-container">
        <header class="screen-container">
            <div class="screen">
                <div id="header-text" class="screen-text"></div>
            </div>
        </header>

        <div class="container mx-auto px-6">
            <div id="notification-container" class="game-notification-container hidden"></div>
        </div>
        
        <main class="container mx-auto px-6 py-12">
            <section id="upcoming-events">
                <h2 class="section-title">Upcoming Events</h2>
                <div id="upcoming-events-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
                    <!-- Dynamic upcoming event cards will be injected here -->
                </div>
            </section>
            
            <section id="past-events" class="mt-16">
                <h2 class="section-title">Mission Archives</h2>
                <div id="past-events-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
                    <!-- Dynamic past event cards will be injected here -->
                </div>
            </section>
        </main>

        <footer class="text-center py-8 text-xs">
            <p>&copy; 2025 73 DOLO. ALL RIGHTS RESERVED.</p>
        </footer>
    </div>

    <!-- ITEM LOOKUP MODAL -->
    <div id="lookup-modal" class="fixed inset-0 bg-black bg-opacity-80 flex items-center justify-center p-4 z-50 hidden">
        <div class="game-modal">
            <div class="game-modal-header">
                <h3>ITEM LOOKUP</h3>
                <button data-modal-hide="lookup-modal" class="close-button">X</button>
            </div>
            <form id="lookup-form" class="p-6">
                <div class="mb-5">
                    <label for="name" class="block mb-2 text-sm">ENTER NAME:</label>
                    <input type="text" id="name" name="name" class="game-input" autocomplete="off" required>
                </div>
                <div id="lookup-result" class="mb-4 hidden text-sm"></div>
                <div class="text-right">
                    <button type="submit" class="game-button">SEARCH</button>
                </div>
            </form>
        </div>
    </div>
    
    <!-- HALLOWEEN COSTUME MODAL -->
    <div id="halloween-modal" class="fixed inset-0 bg-black bg-opacity-80 flex items-center justify-center p-4 z-50 hidden">
        <div class="game-modal">
            <div class="game-modal-header">
                <h3>COSTUME CONTEST</h3>
                <button data-modal-hide="halloween-modal" class="close-button">X</button>
            </div>
            <div class="p-6">
                <form id="halloween-vote-form">
                    <div class="mb-5">
                        <label for="costume-name" class="block mb-2 text-sm">ENTER COSTUME NAME:</label>
                        <input type="text" id="costume-name" name="costume" class="game-input" required>
                    </div>
                    <div class="text-right">
                        <button type="submit" class="game-button">VOTE</button>
                    </div>
                </form>
                <div id="halloween-results" class="mt-6"></div>
            </div>
        </div>
    </div>

    <!-- POKER LEDGER MODAL -->
    <div id="ledger-modal" class="fixed inset-0 bg-black bg-opacity-80 flex items-center justify-center p-4 z-50 hidden">
        <div class="game-modal max-w-2xl">
            <div class="game-modal-header">
                <h3 id="ledger-title">POKER LEDGER</h3>
                <button data-modal-hide="ledger-modal" class="close-button">X</button>
            </div>
            <div class="ledger-tab-nav">
                <button class="ledger-tab active" data-tab="event-ledger-content">Event Ledger</button>
                <button class="ledger-tab" data-tab="universal-ledger-content">Universal Ledger</button>
            </div>
            <div class="p-4">
                <div id="event-ledger-content" class="ledger-tab-content active">
                    <div class="overflow-x-auto overflow-y-auto max-h-96">
                        <table class="ledger-table">
                            <thead>
                                <tr>
                                    <th>Player</th>
                                    <th>Buy-in</th>
                                    <th>Cash-out</th>
                                    <th>Net</th>
                                </tr>
                            </thead>
                            <tbody id="event-ledger-table-body"></tbody>
                        </table>
                    </div>
                </div>
                <div id="universal-ledger-content" class="ledger-tab-content">
                     <div class="overflow-x-auto overflow-y-auto max-h-96">
                        <table class="ledger-table">
                            <thead>
                                <tr>
                                    <th>Player</th>
                                    <th>Total Buy-in</th>
                                    <th>Total Cash-out</th>
                                    <th>Total Net</th>
                                </tr>
                            </thead>
                            <tbody id="universal-ledger-table-body"></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <script src="static/js/main.js"></script>
</body>
</html>
